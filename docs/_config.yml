# Jekyll configuration for the libcmc documentation site.
#
# One build serves GitHub Pages (gburd.github.io/libcmc) and Codeberg
# Pages (gregburd.codeberg.page/libcmc); both serve under /libcmc.
#
# Local preview (nix develop has ruby, bundler and mandoc):
#   sh docs/gen_man_pages.sh && cd docs && bundle install && bundle exec jekyll serve

title: libcmc
description: >-
  An explicit-state model checker for C protocol code: the code it
  checks is the code that ships.
lang: en

theme: just-the-docs

defaults:
  - scope:
      path: ""
    values:
      layout: content

baseurl: "/libcmc"

search_enabled: true
search:
  heading_level: 3
  previews: 3

highlighter: rouge
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  input: GFM
  hard_wrap: false

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Source (Codeberg)":
    - "https://codeberg.org/gregburd/libcmc"
  "Mirror (GitHub)":
    - "https://github.com/gburd/libcmc"

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Careful
    color: red

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - lychee.toml
  - gen_man_pages.sh
  - steering/
  - measurements/*.txt
